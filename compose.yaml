name: aldeia-lidar
services:
  web:
    image: aldeia-lidar:local
    build:
      context: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LIDAR_PORT:-8766}:8080"
    volumes:
      - type: bind
        source: ${LIDAR_DOCS_DIR:-./docs}
        target: /srv/www
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
