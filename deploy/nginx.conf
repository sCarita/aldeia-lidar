worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    gzip on;
    gzip_vary on;
    gzip_comp_level 2;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css image/svg+xml text/plain;

    server {
        listen 8080;
        root /srv/www;
        index index.html;
        autoindex off;
        # Keep redirects relative behind Tailscale's HTTPS reverse proxy.
        absolute_redirect off;
        # Conditional requests keep changed manifests/packets consistent.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }
        location = / {
            return 302 /lidar/aldeia-da-mata/surface.html;
        }
        location = /lidar {
            return 308 /lidar/;
        }
        location = /lidar/ {
            return 302 /lidar/aldeia-da-mata/surface.html;
        }
        location ~ /\. {
            deny all;
        }
        # Also accept unprefixed paths if a reverse proxy strips /lidar/.
        location /lidar/ {
            alias /srv/www/;
        }
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
